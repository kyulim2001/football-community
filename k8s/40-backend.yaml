apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: football
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: football
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z db 3306 && nc -z redis 6379; do echo waiting for db and redis; sleep 3; done"]
      containers:
        - name: backend
          image: football-community-backend:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: app-env
          env:
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "3306"
            - name: REDIS_HOST
              value: redis
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              memory: 150Mi
              cpu: 100m
            limits:
              memory: 400Mi
          volumeMounts:
            - name: static-data
              mountPath: /app/staticfiles
            - name: media-data
              mountPath: /app/media
      volumes:
        - name: static-data
          persistentVolumeClaim:
            claimName: static-data
        - name: media-data
          persistentVolumeClaim:
            claimName: media-data
